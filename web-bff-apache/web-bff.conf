# Web BFF (Token Handler) = Apache + mod_auth_openidc
# 브라우저: HttpOnly 세션 쿠키만 보유 / JWT 는 서버측 세션 캐시에 보관 → 업스트림에 Bearer 주입
ServerName web.localhost
ServerTokens Prod

OIDCProviderMetadataURL ${OIDC_METADATA_BASE}/.well-known/openid-configuration
OIDCClientID web-bff
OIDCClientSecret ${WEB_BFF_SECRET}
OIDCRedirectURI http://web.localhost:8000/oidc/callback
OIDCCryptoPassphrase ${OIDC_CRYPTO}
OIDCScope "openid profile email"
OIDCResponseType code
OIDCRemoteUserClaim preferred_username
OIDCSessionType server-cache
OIDCSessionInactivityTimeout 1800
OIDCSessionMaxDuration 36000
OIDCCookie web_session
OIDCCookieHTTPOnly On
OIDCPassClaimsAs both

<VirtualHost *:80>
    DocumentRoot /var/www/web

    # CSRF: 상태변경 API 는 커스텀 헤더 필수
    RewriteEngine On
    RewriteCond %{REQUEST_URI} ^/api/
    RewriteCond %{REQUEST_METHOD} !^(GET|HEAD|OPTIONS)$
    RewriteCond %{HTTP:X-Requested-With} !^XMLHttpRequest$
    RewriteRule .* - [F]

    <Location />
        AuthType openid-connect
        Require valid-user
    </Location>

    <Location /api/>
        AuthType openid-connect
        Require valid-user
        OIDCUnAuthAction 401 true
        ProxyPass http://api-gw:8000/internal/api/
        ProxyPassReverse http://api-gw:8000/internal/api/
        RequestHeader unset Cookie
        RequestHeader set Authorization "Bearer %{OIDC_access_token}e" env=OIDC_access_token
    </Location>
</VirtualHost>
